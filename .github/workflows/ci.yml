name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        # Pinned to an exact patch on purpose: a floating minor ('1.27') lets
        # CI silently move to a newer patch, and Go's internal export-data
        # format can change between patches (1.27.1 emits V4, 1.27.2 emits
        # V5). golangci-lint loads compiled package data through x/tools and
        # can only decode the format of the toolchain it was built with, so a
        # newer Go here breaks the lint step with "export data version 5 is
        # greater than maximum supported version 4". Keep this at or below the
        # Go that the pinned golangci-lint was built with.
        go-version: '1.27.1'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test ./...

    - name: Run go vet
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        install-mode: goinstall

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files need to be formatted:"
          gofmt -s -l .
          exit 1
        fi

    - name: Build all platforms
      run: |
        GOOS=linux GOARCH=amd64 go build ./...
        GOOS=linux GOARCH=arm64 go build ./...
        GOOS=darwin GOARCH=amd64 go build ./...
        GOOS=darwin GOARCH=arm64 go build ./...
        GOOS=windows GOARCH=amd64 go build ./...
