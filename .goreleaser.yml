version: 2

project_name: must

before:
  hooks:
    - go mod tidy

builds:
  - id: must
    main: ./cmd/must
    binary: must
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X github.com/pdfrg/must/internal/api.LastFMAPIKey={{.Env.LASTFM_KEY}}
      - -X github.com/pdfrg/must/internal/api.LastFMSharedSecret={{.Env.LASTFM_SECRET}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: must
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  github:
    owner: pdfrg
    name: must
  draft: false

# NOTE: the default changelog format embeds committer emails — never use it.
# This format intentionally omits all author fields.
changelog:
  use: git
  sort: asc
  format: "* {{ .Message }} ({{ .SHA }})"
  abbrev: 7
